<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - SerbisyoNow</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a3a8f" />
  <link rel="icon" href="/image_logo/main_logo.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      font-family: Poppins, Arial, sans-serif;
      color: #102044;
      background: #eef4ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 480px);
      background: #fff;
      border: 1px solid #d7e2f5;
      border-radius: 24px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 22px 45px rgba(30, 58, 138, 0.14);
    }

    img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 10px;
      color: #1a3a8f;
      font-size: 1.75rem;
      font-weight: 900;
    }

    p {
      margin: 0 0 22px;
      color: #5b6984;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: #2b55cc;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="/shared/css/pwa-responsive.css" />
  <link rel="apple-touch-icon" href="/image_logo/pwa/icon-192.png" />
</head>
<body>
  <main>
    <img src="/image_logo/main_logo.svg" alt="SerbisyoNow logo" />
    <h1>You are offline</h1>
    <p>SerbisyoNow needs internet for login, bookings, messages, maps, and live database updates. Static pages may still open from cache.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </main>
  <script src="/shared/js/pwa-register.js"></script>
</body>
</html>
