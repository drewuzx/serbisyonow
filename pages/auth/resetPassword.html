<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SerbisyoNow - Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../shared/css/variables.css"/>
  <link rel="stylesheet" href="../../shared/css/sn-topbar.css"/>
  <link rel="stylesheet" href="../../shared/css/auth.css?v=20260915-forgot-password"/>
  <link rel="stylesheet" href="../landing/landing.css"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#1a3a8f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="SerbisyoNow"/>
  <link rel="icon" href="/image_logo/main_logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/shared/css/pwa-responsive.css"/>
  <link rel="apple-touch-icon" href="/image_logo/pwa/icon-192.png"/>
</head>
<body>
  <header class="sn-topbar no-search">
    <div class="container sn-topbar-inner">
      <a class="sn-topbar-brand" href="../landing/index.html">
        <div class="sn-topbar-logo"><img src="../../image_logo/main_logo.svg" alt="SerbisyoNow logo"/></div>
        <span class="sn-topbar-title"><span>Serbisyo</span><span>Now</span></span>
      </a>
      <div class="sn-topbar-right">
        <div class="sn-topbar-actions">
          <a href="loginChoice.html" class="btn btn-outline btn-sm">Login Options</a>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-content">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="nav-logo-icon-login"><img src="../../image_logo/main_logo.svg" alt="SerbisyoNow logo"/></div>
          <div class="auth-logo-text"><span class="part1">Serbisyo</span><span class="part2">Now</span></div>
        </div>

        <div class="auth-heading">
          <h1>Create New Password</h1>
          <p>Use at least 8 characters for your new password.</p>
        </div>

        <div id="reset-banner" class="auth-banner" hidden></div>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label for="password">New password</label>
            <div class="input-wrap">
              <input class="form-control" type="password" id="password" placeholder="Enter new password" autocomplete="new-password" required/>
              <button type="button" class="toggle-pw" aria-label="Toggle password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <div class="input-wrap">
              <input class="form-control" type="password" id="confirm-password" placeholder="Confirm new password" autocomplete="new-password" required/>
              <button type="button" class="toggle-pw" aria-label="Toggle password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="reset-btn">Update Password</button>
        </form>

        <div id="reset-success" class="auth-success-panel" hidden>
          <strong>Password updated</strong>
          <span>You can now login with your new password.</span>
          <div class="reset-dev-link">
            <a id="success-login-link" class="btn btn-primary btn-full" href="loginChoice.html">Go to Login</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="../../shared/js/app.js?v=20260915-api"></script>
  <script src="../../shared/js/resetPassword.js?v=20260915-forgot-password"></script>
  <script src="/shared/js/pwa-register.js"></script>
</body>
</html>
