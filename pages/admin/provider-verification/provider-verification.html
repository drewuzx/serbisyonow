<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Verification - SerbisyoNow</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/variables.css" />
  <link rel="stylesheet" href="../admin-module.css" />
  <link rel="stylesheet" href="./provider-verification.css?v=20261110-smart-search" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a3a8f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SerbisyoNow" />
  <link rel="icon" href="/image_logo/main_logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/css/pwa-responsive.css" />
  <link rel="apple-touch-icon" href="/image_logo/pwa/icon-192.png" />
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-header shell"><div class="admin-brand"><p class="eyebrow">ADMIN PROVIDER VERIFICATION</p><h1>Service Provider Verification Page</h1><p>Provider credentials loaded from the database.</p></div><div class="admin-header-actions"><a class="btn btn-light" href="../user-management/user-management.html">All Users</a></div></header>
    <nav class="admin-module-nav"><a href="../dashboard/dashboard.html">Dashboard</a><a href="../user-management/user-management.html">Users</a><a class="active" href="./provider-verification.html">Provider Verification</a><a href="../categories/categories.html">Categories</a><a href="../reports/reports.html">Reports</a><a href="../feedback/feedback.html">Feedback</a></nav>
    <section class="admin-panel"><div class="admin-panel-head"><h2>Provider Submissions</h2><span class="pill" id="provider-count">0 providers</span></div><p class="admin-form-message" id="provider-message" hidden></p><div class="provider-search"><input id="provider-search-input" class="provider-search-input" type="search" placeholder="Search by name, email, contact, service..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="provider-search-suggestions" aria-expanded="false" /><div id="provider-search-suggestions" class="provider-search-suggestions" role="listbox" aria-label="Matching providers" hidden></div></div><div class="admin-list" id="provider-list"></div></section>
  </main>
  <script src="../admin-data.js?v=20261110-smart-search-rank"></script>
  <script src="./provider-details.js"></script>
  <script src="./photo-reviews.js"></script>
  <script>
    const providerMessage = document.getElementById('provider-message');
    const providerSearchInput = document.getElementById('provider-search-input');
    const providerSuggestions = document.getElementById('provider-search-suggestions');
    let allProviders = [];
    let selectedProviderId = null;
    let activeProviderSuggestion = -1;
    let providerMutationPending = false;

    function providerActions(provider) {
      if (!provider.id) return '';
      const status = String(provider.verification_status || 'pending').toLowerCase();
      if (status === 'rejected') {
        return `<button class="btn btn-success" type="button" data-verify-provider="${provider.id}">Verify</button>`;
      }
      if (status === 'verified') return '';
      return `<button class="btn btn-success" type="button" data-verify-provider="${provider.id}">Verify</button><button class="btn btn-neutral" type="button" data-reject-provider="${provider.id}">Decline</button>`;
    }

    function providerUploadUrl(folder, filename) {
      return `${ADMIN_API_BASE}/uploads/${folder}/${encodeURIComponent(filename)}`;
    }

    function providerFileName(filename) {
      return String(filename || '')
        .replace(/^\d+-(?:[a-f0-9]{24}|\d+)-/, '')
        .replace(/[-_]+/g, ' ')
        .trim() || 'Uploaded file';
    }

    function providerFileLink(folder, filename, label) {
      if (!filename) return '';
      return `
        <button class="admin-file-link" type="button" data-private-file="${providerUploadUrl(folder, filename)}">
          <span>${adminEscape(label)}</span>
          <strong>${adminEscape(providerFileName(filename))}</strong>
        </button>
      `;
    }

    function providerDocumentLinks(provider) {
      const docs = (Array.isArray(provider.documents_files) ? provider.documents_files : []).filter(Boolean);
      const idLinks = [
        providerFileLink('customer-ids', provider.id_front_file, 'Front ID'),
        providerFileLink('customer-ids', provider.id_back_file, 'Back ID'),
      ].filter(Boolean);
      const documentLinks = docs.map((filename, index) => providerFileLink('provider-docs', filename, `Document ${index + 1}`));
      const groups = [
        idLinks.length ? `<div class="admin-file-group"><span class="admin-file-heading">Identity uploads</span><div class="admin-file-grid">${idLinks.join('')}</div></div>` : '',
        documentLinks.length ? `<div class="admin-file-group"><span class="admin-file-heading">Credentials &amp; proof of work</span><div class="admin-file-grid">${documentLinks.join('')}</div></div>` : '',
      ].filter(Boolean);
      return groups.length ? `<div class="admin-provider-files">${groups.join('')}</div>` : '<span class="admin-file-empty">No files uploaded</span>';
    }

    function setProviderMessage(text, type = 'info') {
      providerMessage.textContent = text;
      providerMessage.className = `admin-form-message ${type}`;
      providerMessage.hidden = !text;
    }

    function renderProviderList(providers) {
      document.getElementById('provider-list').innerHTML = (providers.length ? providers : [{ full_name: allProviders.length ? 'No providers match this search' : 'No provider registrations yet', category: '-', service: '-', verification_status: 'pending' }]).map(provider => `
        ${(() => { const status = adminVerificationStatus(provider.verification_status); return `
        <div class="admin-list-item">
          <div class="admin-provider-main">
            ${provider.id ? `<button class="admin-provider-profile-link" type="button" data-provider-details="${provider.id}" aria-label="View profile of ${adminEscape(provider.full_name)}">${adminEscape(provider.full_name)}</button>` : `<strong>${adminEscape(provider.full_name)}</strong>`}
            <span>${adminEscape(adminCategoryLabel(provider.category) || '-')} - ${adminEscape(provider.service || '-')} - ${adminEscape(provider.email || '')}</span>
            <span>Assessment: ${provider.assessment_score ?? 0}% - Experience: ${adminEscape(provider.experience_years || '-')} - Badge: ${adminEscape(provider.badge_status || 'Needs Reassessment')}</span>
            ${provider.badge_details ? `<span>Badge score: ${provider.badge_details.total_points}/100 (Assessment ${provider.badge_details.assessment_points} + Credentials ${provider.badge_details.credential_points} + Ratings ${provider.badge_details.rating_points})</span>` : ''}
            <div class="admin-upload-block">
              <span class="admin-upload-title">Uploaded files</span>
              ${providerDocumentLinks(provider)}
            </div>
          </div>
          <div class="admin-actions">
            <span class="status-badge ${status.className}">${status.label}</span>
            ${providerActions(provider)}
          </div>
        </div>
        `; })()}
        `).join('');
    }

    function applyProviderSearch() {
      const query = String(providerSearchInput?.value || '').trim().toLowerCase();
      const providers = allProviders.filter(provider => {
        if (selectedProviderId !== null && String(provider.id) !== selectedProviderId) return false;
        if (!query) return true;
        return adminSearchRank(query, [provider.id, provider.full_name, provider.email, provider.contact, provider.category,
          provider.service, provider.experience_years, provider.badge_status, provider.verification_status,
          adminVerificationStatus(provider.verification_status).label]);
      });
      document.getElementById('provider-count').textContent = `${providers.length} of ${allProviders.length} providers`;
      renderProviderList(providers);
    }

    function renderProviderSuggestions() {
      if (!providerSearchInput || !providerSuggestions) return;
      const query = providerSearchInput.value.trim().toLowerCase();
      providerSuggestions.replaceChildren();
      activeProviderSuggestion = -1;
      if (!query || selectedProviderId !== null) {
        providerSuggestions.hidden = true;
        providerSearchInput.setAttribute('aria-expanded', 'false');
        providerSearchInput.removeAttribute('aria-activedescendant');
        return;
      }
      const matches = allProviders.map(provider => ({
        provider,
        rank: adminSearchRank(query, [provider.id, provider.full_name, provider.email, provider.contact, provider.category,
          provider.service, provider.experience_years, provider.badge_status, provider.verification_status,
          adminVerificationStatus(provider.verification_status).label]),
      })).filter(result => result.rank >= 0)
        .sort((a, b) => b.rank - a.rank || String(a.provider.full_name || '').localeCompare(String(b.provider.full_name || '')))
        .slice(0, 6).map(result => result.provider);
      if (!matches.length) {
        const empty = document.createElement('div');
        empty.className = 'provider-search-empty';
        empty.textContent = 'No matching providers';
        providerSuggestions.appendChild(empty);
      } else matches.forEach((provider, index) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'provider-search-option';
        option.id = `provider-search-option-${index}`;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', 'false');
        const name = document.createElement('span');
        name.className = 'provider-search-name';
        name.textContent = provider.full_name || 'Unnamed provider';
        const details = document.createElement('span');
        details.className = 'provider-search-details';
        details.textContent = [`ID ${provider.id}`, provider.email, provider.contact, provider.service || adminCategoryLabel(provider.category), adminVerificationStatus(provider.verification_status).label].filter(Boolean).join(' | ');
        option.append(name, details);
        option.addEventListener('pointerdown', event => event.preventDefault());
        option.addEventListener('click', () => {
          providerSearchInput.value = provider.full_name || provider.email || '';
          selectedProviderId = String(provider.id);
          providerSuggestions.hidden = true;
          providerSearchInput.setAttribute('aria-expanded', 'false');
          applyProviderSearch();
        });
        providerSuggestions.appendChild(option);
      });
      providerSuggestions.hidden = false;
      providerSearchInput.setAttribute('aria-expanded', 'true');
    }

    function moveProviderSuggestion(direction) {
      const options = [...providerSuggestions.querySelectorAll('.provider-search-option')];
      if (!options.length) return false;
      activeProviderSuggestion = (activeProviderSuggestion + direction + options.length) % options.length;
      options.forEach((option, index) => {
        const active = index === activeProviderSuggestion;
        option.setAttribute('aria-selected', String(active));
        if (active) {
          providerSearchInput.setAttribute('aria-activedescendant', option.id);
          option.scrollIntoView({ block: 'nearest' });
        }
      });
      return true;
    }

    function loadProviders(options) {
      return adminGet('/api/admin/providers?status=all').then(({ providers }) => {
        if (!adminDataChanged('providers', providers, options)) return;
        allProviders = Array.isArray(providers) ? providers : [];
        applyProviderSearch();
        renderProviderSuggestions();
      });
    }

    document.getElementById('provider-list').addEventListener('click', async (event) => {
      const fileButton = event.target.closest('[data-private-file]');
      if (fileButton) { adminViewPrivateFile(fileButton.dataset.privateFile); return; }
      if (providerMutationPending) return;
      const verifyBtn = event.target.closest('[data-verify-provider]');
      const rejectBtn = event.target.closest('[data-reject-provider]');
      const id = verifyBtn?.dataset.verifyProvider || rejectBtn?.dataset.rejectProvider;
      if (!id) return;
      setProviderMessage('');
      const button = verifyBtn || rejectBtn;
      providerMutationPending = true;
      const actions = [...button.closest('.admin-actions').querySelectorAll('button')];
      actions.forEach(action => { action.disabled = true; });
      try {
        const endpoint = verifyBtn ? 'verify' : 'reject';
        await adminSend(`/api/admin/providers/${id}/${endpoint}`, { method: 'PATCH' });
        setProviderMessage('Provider submission updated.', 'success');
      } catch (error) {
        setProviderMessage(error.message, 'error');
      } finally {
        providerMutationPending = false;
        actions.forEach(action => { action.disabled = false; });
        await loadProviders().catch(error => setProviderMessage(error.message, 'error'));
      }
    });

    loadProviders().catch(error => {
      document.getElementById('provider-list').innerHTML = `<div class="admin-list-item"><strong>${adminEscape(error.message)}</strong></div>`;
    });
    providerSearchInput.addEventListener('input', () => {
      selectedProviderId = null;
      applyProviderSearch();
      renderProviderSuggestions();
    });
    providerSearchInput.addEventListener('focus', renderProviderSuggestions);
    providerSearchInput.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' && moveProviderSuggestion(1)) event.preventDefault();
      else if (event.key === 'ArrowUp' && moveProviderSuggestion(-1)) event.preventDefault();
      else if (event.key === 'Enter') {
        const active = providerSuggestions.querySelector('.provider-search-option[aria-selected="true"]');
        if (active) { event.preventDefault(); active.click(); }
        else providerSuggestions.hidden = true;
      } else if (event.key === 'Escape') {
        providerSuggestions.hidden = true;
        providerSearchInput.setAttribute('aria-expanded', 'false');
        providerSearchInput.removeAttribute('aria-activedescendant');
      }
    });
    document.addEventListener('pointerdown', event => {
      if (event.target.closest('.provider-search')) return;
      providerSuggestions.hidden = true;
      providerSearchInput.setAttribute('aria-expanded', 'false');
      providerSearchInput.removeAttribute('aria-activedescendant');
    });
    adminLive('providers', loadProviders);
  </script>
  <script src="/shared/js/pwa-register.js"></script>
</body>
</html>
