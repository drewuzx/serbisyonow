<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback - SerbisyoNow</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/variables.css" />
  <link rel="stylesheet" href="../admin-module.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a3a8f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SerbisyoNow" />
  <link rel="icon" href="/image_logo/main_logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/css/pwa-responsive.css" />
  <link rel="apple-touch-icon" href="/image_logo/pwa/icon-192.png" />
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-header shell"><div class="admin-brand"><p class="eyebrow">ADMIN FEEDBACK</p><h1>Feedback Page</h1><p>User-submitted feedback loaded from the database.</p></div><div class="admin-header-actions"><button class="btn btn-light" onclick="location.reload()">Refresh</button></div></header>
    <nav class="admin-module-nav"><a href="../dashboard/dashboard.html">Dashboard</a><a href="../user-management/user-management.html">Users</a><a href="../provider-verification/provider-verification.html">Provider Verification</a><a href="../categories/categories.html">Categories</a><a href="../reports/reports.html">Reports</a><a class="active" href="./feedback.html">Feedback</a></nav>
    <section class="admin-panel"><div class="admin-panel-head"><h2>Feedback</h2><span class="pill" id="feedback-count">0 records</span></div><p class="admin-form-message" id="feedback-message" hidden></p><div class="admin-list" id="feedback-list"></div></section>
  </main>
  <script src="../admin-data.js"></script>
  <script>
    const feedbackMessage = document.getElementById('feedback-message');

    function setFeedbackMessage(text, type = 'info') {
      feedbackMessage.textContent = text;
      feedbackMessage.className = `admin-form-message ${type}`;
      feedbackMessage.hidden = !text;
    }

    function loadFeedback() {
      return adminGet('/api/admin/feedback?status=all').then(({ feedback }) => {
        document.getElementById('feedback-count').textContent = `${feedback.length} records`;
        document.getElementById('feedback-list').innerHTML = feedback.map(item => `
          <div class="admin-list-item">
            <div><strong>${adminEscape(item.subject)}</strong><span>${adminEscape(item.submitted_by)}${item.related_party ? ` | ${adminEscape(item.related_party)}` : ''} - ${adminFormatDate(item.created_at)}</span><p>${adminEscape(item.message)}</p></div>
            <div class="admin-actions">
              <span class="status-badge ${item.status === 'resolved' || item.status === 'logged' ? 'verified' : 'pending'}">${adminEscape(item.status)}</span>
              <select class="form-control" data-feedback-status="${item.id}">
                <option value="open" ${item.status === 'open' ? 'selected' : ''}>Open</option>
                <option value="review" ${item.status === 'review' ? 'selected' : ''}>Review</option>
                <option value="resolved" ${item.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                <option value="logged" ${item.status === 'logged' ? 'selected' : ''}>Logged</option>
              </select>
            </div>
          </div>
        `).join('') || '<div class="admin-list-item"><strong>No feedback records yet</strong></div>';
      });
    }

    document.getElementById('feedback-list').addEventListener('change', async (event) => {
      const select = event.target.closest('[data-feedback-status]');
      if (!select) return;
      setFeedbackMessage('');
      select.disabled = true;
      try {
        await adminSend(`/api/admin/feedback/${select.dataset.feedbackStatus}/status`, {
          method: 'PATCH',
          body: { status: select.value },
        });
        setFeedbackMessage('Feedback status updated.', 'success');
      } catch (error) {
        setFeedbackMessage(error.message, 'error');
      } finally {
        await loadFeedback();
      }
    });

    loadFeedback().catch(error => setFeedbackMessage(error.message, 'error'));
  </script>
  <script src="/shared/js/pwa-register.js"></script>
</body>
</html>
