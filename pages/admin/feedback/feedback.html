<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback - SerbisyoNow</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/variables.css" />
  <link rel="stylesheet" href="../admin-module.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a3a8f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SerbisyoNow" />
  <link rel="icon" href="/image_logo/main_logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/css/pwa-responsive.css" />
  <link rel="apple-touch-icon" href="/image_logo/pwa/icon-192.png" />
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-header shell"><div class="admin-brand"><p class="eyebrow">ADMIN FEEDBACK</p><h1>Feedback</h1><p>System ratings and user feedback.</p></div><div class="admin-header-actions"><button class="btn btn-light" onclick="loadFeedback().catch(handleFeedbackError)">Refresh</button></div></header>
    <nav class="admin-module-nav"><a href="../dashboard/dashboard.html">Dashboard</a><a href="../user-management/user-management.html">Users</a><a href="../provider-verification/provider-verification.html">Provider Verification</a><a href="../categories/categories.html">Categories</a><a href="../reports/reports.html">Reports</a><a class="active" href="./feedback.html">Feedback</a></nav>
    <section class="admin-panel">
      <div class="admin-panel-head"><h2>All Feedback</h2><span class="pill" id="feedback-count">0 records</span></div>
      <p id="feedback-summary" class="admin-feedback-summary"></p>
      <div class="admin-feedback-filters">
        <label>Feedback type<select class="form-control" id="feedback-source" aria-label="Feedback type"><option value="all">All feedback</option><option value="system">System ratings</option><option value="general">Other feedback</option></select></label>
        <label>Account type<select class="form-control" id="feedback-role" aria-label="Account type"><option value="all">All accounts</option><option value="customer">Customer</option><option value="provider">Provider</option></select></label>
        <label>Rating<select class="form-control" id="feedback-rating" aria-label="Rating"><option value="all">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label>
      </div>
      <p class="admin-form-message" id="feedback-message" hidden></p>
      <a class="btn btn-light" id="feedback-login" href="../../auth/adminLogin.html" hidden>Sign In as Admin</a>
      <div class="admin-list" id="feedback-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="../admin-data.js"></script>
  <script>
    const feedbackMessage = document.getElementById('feedback-message');
    let feedbackRows = [];

    function setFeedbackMessage(text, type = 'info') {
      feedbackMessage.textContent = text;
      feedbackMessage.className = `admin-form-message ${type}`;
      feedbackMessage.hidden = !text;
    }

    function handleFeedbackError(error) {
      setFeedbackMessage(error.message, 'error');
      if (error.status === 401 || error.status === 403) {
        adminLiveSignatures.delete('feedback');
        document.getElementById('feedback-login').hidden = false;
        feedbackRows = [];
        renderFeedback();
      }
    }

    function renderFeedback() {
      const source = document.getElementById('feedback-source').value;
      const role = document.getElementById('feedback-role').value;
      const rating = document.getElementById('feedback-rating').value;
      const visible = feedbackRows.filter(item => (source === 'all' || (item.source || 'general') === source)
        && (role === 'all' || item.submitted_role === role) && (rating === 'all' || Number(item.rating) === Number(rating)));
      const rated = feedbackRows.filter(item => item.source === 'system' && item.rating);
      document.getElementById('feedback-summary').textContent = rated.length
        ? `${(rated.reduce((sum, item) => sum + Number(item.rating), 0) / rated.length).toFixed(1)}/5 average system rating | ${rated.length} system rating${rated.length === 1 ? '' : 's'}` : 'No system ratings yet.';
      document.getElementById('feedback-count').textContent = `${visible.length} of ${feedbackRows.length} records`;
      document.getElementById('feedback-list').innerHTML = visible.map(item => `
          <div class="admin-list-item">
            <div class="admin-feedback-content"><strong>${adminEscape(item.subject)}</strong>
              ${item.source === 'system' ? `<div class="admin-feedback-rating" aria-label="${Number(item.rating)} out of 5 stars"><span aria-hidden="true">${'&#9733;'.repeat(Number(item.rating))}${'&#9734;'.repeat(5 - Number(item.rating))}</span><b>${Number(item.rating)}/5</b></div>` : ''}
              <span>${adminEscape(item.submitted_by)}${item.submitted_role ? ` | ${item.submitted_role === 'provider' ? 'Provider' : 'Customer'}` : ''}${item.related_party ? ` | ${adminEscape(item.related_party)}` : ''} - ${adminFormatDate(item.created_at)}</span><p>${adminEscape(item.message || 'No comment provided.')}</p></div>
            <div class="admin-actions">
              <span class="status-badge ${item.status === 'resolved' || item.status === 'logged' ? 'verified' : 'pending'}">${adminEscape(item.status)}</span>
              <select class="form-control" data-feedback-status="${item.id}" aria-label="Status for feedback ${item.id}">
                <option value="open" ${item.status === 'open' ? 'selected' : ''}>Open</option>
                <option value="review" ${item.status === 'review' ? 'selected' : ''}>Review</option>
                <option value="resolved" ${item.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                <option value="logged" ${item.status === 'logged' ? 'selected' : ''}>Logged</option>
              </select>
            </div>
          </div>
        `).join('') || `<div class="admin-list-item"><strong>${feedbackRows.length ? 'No feedback matches these filters' : 'No feedback records yet'}</strong></div>`;
    }

    function loadFeedback(options) {
      return adminGet('/api/admin/feedback?status=all').then(({ feedback }) => {
        if (!adminDataChanged('feedback', feedback, options)) return;
        feedbackRows = feedback;
        document.getElementById('feedback-login').hidden = true;
        renderFeedback();
      });
    }

    document.querySelector('.admin-feedback-filters').addEventListener('change', renderFeedback);

    document.getElementById('feedback-list').addEventListener('change', async (event) => {
      const select = event.target.closest('[data-feedback-status]');
      if (!select) return;
      setFeedbackMessage('');
      select.disabled = true;
      try {
        await adminSend(`/api/admin/feedback/${select.dataset.feedbackStatus}/status`, {
          method: 'PATCH',
          body: { status: select.value },
        });
        setFeedbackMessage('Feedback status updated.', 'success');
      } catch (error) {
        handleFeedbackError(error);
      } finally {
        select.disabled = false;
        await loadFeedback().catch(handleFeedbackError);
      }
    });

    loadFeedback().catch(handleFeedbackError);
    adminLive('feedback', options => loadFeedback(options).catch(handleFeedbackError));
  </script>
  <script src="/shared/js/pwa-register.js"></script>
</body>
</html>
